<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="../assets/icon/OIP (1).jpg">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL | Dashboard</title>

    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/estilo.css" />

    <script src="../js/sessao.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <div class="janela">
        <div class="header-left">
            <h1>NFL</h1>

            <div class="hello">
                <h3>Olá, <span id="b_usuario"></span>!</h3>
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>

            <div class = "botao_voltar" onclick="voltarpagina()" >
                <h3>Voltar</h3>
            </div>     
              <div class = "botao_voltar" onclick="tabelaTimes()" >
                <h3>Tabela de times</h3>
            </div>               
        </div>

        <div class="dash">
            <div id="kpis">

                <div class="kpi">
                    <h4>Time Mais Escolhido</h4>
                    <p id="kpi_time_mais_escolhido"></p>
                </div>

                <div class="kpi">
                    <h4>Pontuação Mais Tirada</h4>
                    <p id="kpi_pontuacao_mais_tirada"></p>
                </div>

                <div class="kpi">
                    <h4>Sua Última Pontuação</h4>
                    <p id="kpi_ultima_pontuacao"></p>
                </div>

            </div>
            <div id="graficos">

                <div class="graph">
                    <h3>Desempenho dos usuários no Quiz</h3>
                    <canvas id="graficoQuiz"></canvas>
                </div>

                <div class="graph">
                    <h3>Times Favoritos dos usuários</h3>
                    <canvas id="graficoTimes"></canvas>
                </div>

            </div>
        </div>
    </div>

</body>

</html>

<script>
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;
    window.onload = function () {
        obterDadosQuiz();
        obterDadosTimes();
        obterKpis();
    }


    

 // ================= QUIZ =================

// Função que busca os dados da distribuição das pontuações do quiz.
function obterDadosQuiz() {
    fetch("/quiz/distribuicao")
        .then(res => res.json())
        .then(resposta => {
            plotarGraficoQuiz(resposta);
        })
        .catch(err => console.error(err));
}

// Função responsável por criar o gráfico de barras.
function plotarGraficoQuiz(resposta) {

    let labels = [];
    let dados = {
        labels: labels,
        datasets: [{
            label: "Quantidade de usuários por pontuação",
            data: [],
            borderColor: "#013369",
            backgroundColor: "#e6005a",
            fill: true,
            tension: 0.3
        }]
    };

    // Percorro os dados recebidos e adiciono as informações ao gráfico.
    resposta.forEach(item => {
        labels.push(item.pontuacao);
        dados.datasets[0].data.push(item.quantidade);
    });

    // Crio o gráfico utilizando a biblioteca Chart.js.
    let myChart = new Chart(document.getElementById("graficoQuiz"), {
        type: "bar",
        data: dados,
        options: {
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        stepSize: 1,
                        color: "white"
                    },
                    title: {
                        display: true,
                        text: "Quantidade de usuários",
                        color: "white"
                    }
                },
                x: {
                    ticks: { color: "white" },
                    title: {
                        display: true,
                        text: "Pontuação",
                        color: "white"
                    }
                }
            }
        }
    });

    // Após 2 segundos, atualizo os dados do gráfico.
    setTimeout(() => atualizarGraficoQuiz(dados, myChart), 2000);
}

// Função que atualiza os dados do gráfico sem precisar recarregar a página.
function atualizarGraficoQuiz(dados, myChart) {

    fetch("/quiz/distribuicao", { cache: 'no-store' })
        .then(res => res.json())
        .then(novoRegistro => {

            // Limpo os dados antigos.
            dados.labels = [];
            dados.datasets[0].data = [];

            // Adiciono os novos dados recebidos.
            novoRegistro.forEach(item => {
                dados.labels.push(item.pontuacao);
                dados.datasets[0].data.push(item.quantidade);
            });

            // Atualizo o gráfico.
            myChart.update();

            // Repito a atualização a cada 2 segundos.
            setTimeout(() => atualizarGraficoQuiz(dados, myChart), 2000);
        })
        .catch(err => console.error(err));
}


// ================= TIMES =================

// Busca os dados dos times escolhidos pelos usuários.
function obterDadosTimes() {
    fetch("/quiz/times-dados")
        .then(res => res.json())
        .then(resposta => {
            plotarGraficoTimes(resposta);
        })
        .catch(err => console.error("Erro times:", err));
}

// Cria o gráfico de pizza com os times.
function plotarGraficoTimes(resposta) {

    if (!resposta || resposta.length == 0) return;

    let labels = [];
    let dados = {
        labels: labels,
        datasets: [{
            data: [],
            backgroundColor: [
                "#013369",
                "#d50a0a",
                "#ffffff",
                "#888888",
                "#00ffcc",
                "#ffaa00"
            ]
        }]
    };

    // Adiciono os nomes dos times e suas quantidades.
    resposta.forEach(item => {
        labels.push(item.nome_time);
        dados.datasets[0].data.push(item.quantidade);
    });

    // Crio o gráfico de pizza.
    let myChart = new Chart(document.getElementById("graficoTimes"), {
        type: "pie",
        data: dados
    });

    // Atualizo o gráfico a cada 2 segundos.
    setTimeout(() => atualizarGraficoTimes(dados, myChart), 2000);
}

// Atualiza os dados do gráfico de times.
function atualizarGraficoTimes(dados, myChart) {

    fetch("/quiz/times-dados", { cache: 'no-store' })
        .then(res => res.json())
        .then(novoRegistro => {

            if (!novoRegistro || novoRegistro.length == 0) return;

            // Limpo os dados atuais.
            dados.labels = [];
            dados.datasets[0].data = [];

            // Adiciono os dados atualizados.
            novoRegistro.forEach(item => {
                dados.labels.push(item.nome_time);
                dados.datasets[0].data.push(item.quantidade);
            });

            // Atualizo o gráfico.
            myChart.update();

            // Continua atualizando a cada 2 segundos.
            setTimeout(() => atualizarGraficoTimes(dados, myChart), 2000);
        })
        .catch(err => console.error("Erro ao atualizar times:", err));
}


// ================= KPIs =================

// Busca as informações das KPIs para exibir na tela.
function obterKpis() {
    fetch("/kpis")
        .then(res => res.json())
        .then(resposta => {

            // Exibo os dados recebidos nos respectivos elementos da página.
            document.getElementById("kpi_time_mais_escolhido").innerHTML = resposta.time_mais_escolhido;
            document.getElementById("kpi_pontuacao_mais_tirada").innerHTML = resposta.pontuacao_mais_tirada;
            document.getElementById("kpi_ultima_pontuacao").innerHTML = resposta.ultima_pontuacao;
        })
        .catch(err => console.error("Erro kpis:", err));
}

// Função para voltar para a página inicial.
function voltarpagina() {
    location.href = "../inicial.html";
}

// Função para acessar a página da tabela de times.
function tabelaTimes() {
    location.href = "./tabela_times.html";
}
</script>
